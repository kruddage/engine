<!doctype html>
<!--
  SPDX-License-Identifier: GPL-2.0-or-later

  The page `cargo xtask build-web` stamps into dist/index.html. Deliberately
  bare: this exists so the wasm has somewhere to load, not as the engine's
  shell. The real one — canvas, editor chrome, the lot — is #819.

  The version placeholder below is substituted at build time from
  version.txt. The build fails if any placeholder of that shape survives, so a
  renamed one cannot ship to the page as literal text.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>krudd __KRUDD_VERSION__</title>
    <style>
      :root {
        color-scheme: dark light;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #101014;
        color: #e6e6ea;
      }
      #status {
        padding: 1rem;
        font-size: 0.9rem;
        text-align: center;
        line-height: 1.6;
      }
      #status.failed {
        color: #ff6b6b;
      }
      noscript {
        color: #ff6b6b;
      }
    </style>
  </head>
  <body>
    <noscript>krudd needs JavaScript and WebAssembly.</noscript>
    <p id="status">loading krudd __KRUDD_VERSION__…</p>
    <script type="module" src="./index.js"></script>
  </body>
</html>
