# The TypeScript packages, laid out by tier — the same tier vocabulary the
# Cargo crates use, so `packages/base/boundary` and `crates/base/math` read as
# the same layer of the same engine. `cargo xtask tiers` walks both trees and
# enforces that a package may depend on its own tier or a lower one, and that
# nothing depends on a shell.
#
# See docs/architecture.md for what each tier is for.
packages:
  - packages/*/*

# pnpm 10 does not run a dependency's install scripts unless it is listed
# here. esbuild's fetches nothing — it only verifies that the platform binary
# from its optionalDependencies matches the wrapper — but an unapproved script
# is a warning on every install, and a warning nobody can act on is a warning
# everyone learns to ignore.
onlyBuiltDependencies:
  - esbuild
