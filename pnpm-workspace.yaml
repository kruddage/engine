#
# The workspace is the physical design of the JavaScript layer, and this list is
# all of it: every package under packages/, every package under tools/. Each
# declares a name, a surface and what it may reach, and `pnpm check` reads those
# declarations back (see WORKSPACE.md, Q1). There are no third-party
# dependencies to resolve.
#
# krudd/ is not here. #917 gave two of the C tree's twenty-three modules a
# manifest and #924 was to have given the other twenty-one theirs; #924 closed
# unstarted, and a tree that is 2/23 packaged is worse than one that is 0/23,
# because a reader cannot tell whether the missing modules are pending or
# excluded on purpose. They are excluded on purpose (#934). The C build is
# kruddmake — Scheme behind a POSIX shell entry point, needing a compiler and
# nothing else — and a manifest beside a build.scm bought that tree nothing it
# did not already have, while inviting Node into the one path that is deliberate
# about not needing it (WORKSPACE.md, Q2).
#
# Both globs, no per-package exceptions. `tools/render-diff` used to be listed
# by name here, and the rest of tools/ — tools/dawn-smoke, at the time this
# comment was written — was reachable by neither this file nor kruddmake, in no
# door at all. A glob would have covered both from the start; a list covers
# whichever entries someone remembered to add. `packages/*` and `tools/*` mean a
# new package under either directory is inside the boundary check the moment it
# exists; tools/barriers/check-barriers.mjs's packageDirs() reads the same shape
# back off the filesystem, because a package the check does not know about is a
# package with no boundary. A directory under tools/ with no package.json — a
# smoke test built from C and a shell script, say — is simply not a package,
# and the glob finds nothing to package there; it is not an exception to carve
# out.
packages:
  - packages/*
  - tools/*
