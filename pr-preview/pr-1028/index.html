<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
	background: #0d0d0d;
	color: #e0e0e0;
	font-family: 'Courier New', Courier, monospace;
	/*
	 * dvh (dynamic viewport height) tracks the *visible* viewport, so the
	 * app shrinks to fit above a mobile browser's dynamic toolbar instead
	 * of extending behind it — otherwise 100vh (the large viewport) hides
	 * the bottom strip of the canvas, and with it kruddgui's bottom-anchored
	 * panels (the mode-bar, the Log handle), under Firefox Android's URL bar.
	 * The 100vh line is the fallback for browsers without dvh.
	 */
	height: 100vh;
	height: 100dvh;
	display: flex;
	flex-direction: column;
	overflow: hidden;
}

/*
 * ── Canvas viewport ──
 *
 * The page is the canvas plus the overlays that sit over it (the launcher, the
 * load prompt, the error box). The DOM editor chrome that used to frame it —
 * menu bar, toolbar, docks and status bar, all built at runtime from a layout
 * spec the engine serialized out of Scheme — is gone, so the canvas is a plain
 * flex child of <body> and has the whole viewport to itself in every state the
 * page has.
 */

.canvas-wrap {
	flex: 1;
	display: flex;
	align-items: center;
	justify-content: center;
	background: #000;
	min-height: 0;
	min-width: 0;
}

canvas {
	display: block;
	max-width: 100%;
	max-height: 100%;
	width: 100%;
	height: 100%;
}

/*
 * Scrolling diagnostic log for WebGPU bring-up, opt-in behind ?webgpulog=1
 * (see the panel's rationale where it is wired up). A lightweight shell-side
 * panel that carries the backend's step-by-step messages with full history —
 * unlike the single-line status bar. Hidden until the first line arrives.
 */
.webgpu-log {
	position: fixed;
	left: 0;
	right: 0;
	bottom: 30px;
	max-height: 42vh;
	overflow-y: auto;
	background: rgba(0, 0, 0, 0.74);
	border-top: 1px solid #333;
	font-family: 'Courier New', Courier, monospace;
	font-size: 11px;
	line-height: 1.55;
	color: #d0d0d0;
	padding: 8px 14px;
	z-index: 6000;
	display: none;
}

.webgpu-log.visible { display: block; }

.webgpu-log .line { white-space: pre-wrap; }

.webgpu-log .line.err { color: #e07a7a; }

/* ── Launcher overlay ── */

.launcher {
	position: fixed;
	inset: 0;
	background: rgba(13, 13, 13, 0.96);
	display: flex;
	align-items: center;
	justify-content: center;
	z-index: 5000;
	padding: 20px;
}

.launcher.hidden { display: none; }

.launcher-close {
	position: absolute;
	top: 16px;
	right: 20px;
	width: 28px;
	height: 28px;
	background: none;
	border: 1px solid #333;
	color: #888;
	font-family: inherit;
	font-size: 18px;
	line-height: 1;
	cursor: pointer;
}

.launcher-close:hover { border-color: #555; color: #ccc; }

/* Matches .launcher-sub/.launcher-games: no dismissing a launcher that hasn't
 * armed its buttons yet (see kruddSetReady below). */
.launcher.loading .launcher-close { display: none; }

.launcher-panel {
	display: flex;
	flex-direction: column;
	align-items: center;
	gap: 10px;
	width: 100%;
	max-width: 360px;
}

.launcher-title {
	font-size: 32px;
	font-weight: bold;
	letter-spacing: 0.3em;
	color: #fff;
}

.launcher-sub {
	font-size: 12px;
	color: #666;
	letter-spacing: 0.15em;
	text-transform: uppercase;
	margin-bottom: 14px;
}

/*
 * Until the engine has rendered its first frame the launcher is painted (static
 * HTML) but not yet armed: the game list and its prompt are hidden and a
 * "loading" note stands in, so an impatient click has no button to hit. The
 * engine flips the .loading class off via kruddSetReady once it is live.
 *
 * The wordmark is hidden along with them, so the ordinary boot — which loads a
 * game and dismisses this overlay the moment it is armed — shows a bare
 * "loading" and then the board, never a splash screen standing between the
 * player and the game. The title is back for ?game=none, where the overlay is
 * the destination rather than something passed through.
 */
.launcher-loading {
	display: none;
	font-size: 12px;
	color: #666;
	letter-spacing: 0.15em;
	text-transform: uppercase;
}

.launcher.loading .launcher-loading { display: block; }

.launcher.loading .launcher-title,
.launcher.loading .launcher-sub,
.launcher.loading .launcher-games { display: none; }

.launcher-games {
	display: flex;
	flex-direction: column;
	gap: 10px;
	width: 100%;
}

.launcher-btn {
	background: #141414;
	border: 1px solid #333;
	border-left: 3px solid #2d6a2d;
	color: #ddd;
	font-family: inherit;
	font-size: 15px;
	letter-spacing: 0.08em;
	padding: 14px 18px;
	cursor: pointer;
	text-align: left;
	transition: border-color 0.12s, background 0.12s;
}

.launcher-btn:hover {
	background: #1c1c1c;
	border-color: #555;
	border-left-color: #4a9a4a;
	color: #fff;
}

/*
 * ── Load prompt ──
 *
 * A one-tap splash that sits over the board the moment a game boots straight
 * in (the default path — see game_boot_index in game.c, which shows this
 * right where it used to just dismiss the launcher and leave bare canvas).
 *
 * It reads as a project loader — "load project" over a button named for the
 * scene that booted — rather than "Play <that game>" over a Play button. The
 * page is an engine you open a project in; the game a build ships staged is
 * one project among however many it carries, and the first screen should say
 * the former and offer the latter, not present the sample as the whole
 * product. The button carries the game's own launcher label, so a different
 * boot default renames it with no edit here.
 *
 * That button is also where the first user gesture lands, so the click handler
 * below resumes the WebAudio context there rather than counting on whatever
 * the player's first move happens to click.
 */
.load-prompt {
	position: fixed;
	inset: 0;
	background: rgba(13, 13, 13, 0.96);
	display: flex;
	align-items: center;
	justify-content: center;
	z-index: 5000;
	padding: 20px;
}

.load-prompt.hidden { display: none; }

.load-prompt-panel {
	display: flex;
	flex-direction: column;
	align-items: center;
	gap: 18px;
}

.load-prompt-title {
	font-size: 22px;
	font-weight: bold;
	letter-spacing: 0.2em;
	text-transform: uppercase;
	color: #fff;
}

.load-prompt-btn {
	background: #141414;
	border: 1px solid #333;
	border-left: 3px solid #2d6a2d;
	color: #ddd;
	font-family: inherit;
	font-size: 16px;
	letter-spacing: 0.15em;
	text-transform: uppercase;
	padding: 12px 40px;
	cursor: pointer;
	transition: border-color 0.12s, background 0.12s;
}

.load-prompt-btn:hover {
	background: #1c1c1c;
	border-color: #555;
	border-left-color: #4a9a4a;
	color: #fff;
}

/*
 * ── Load Project ──
 *
 * The engine's one piece of permanent chrome. Everything else on this page is a
 * splash you pass through — the launcher goes down on the first pick and never
 * comes back, the load prompt goes down on its one tap — because they exist to
 * get you to a scene. This has to outlast them: opening a project is not a boot
 * step, it is the thing the page is for, and it must be reachable from the
 * scene a project is already running so that a second file replaces the first
 * (project_host_load in game/project). Hence a control parked in the corner
 * rather than a fourth overlay in the boot sequence.
 *
 * It sits in the top-left because the engine's own UI (kruddgui) anchors to the
 * bottom of the viewport, and it is dim until hovered so that a corner of a
 * running game is not spending its contrast on a button.
 */
.project-open {
	position: fixed;
	top: 10px;
	left: 10px;
	/* Above the launcher and the load prompt (5000), below the panel it
	 * opens (5500) and the error box (9999): the one control that is
	 * reachable from every state the page has, including the boot splash
	 * that already says "load project". */
	z-index: 5200;
	background: rgba(20, 20, 20, 0.72);
	border: 1px solid #2a2a2a;
	border-left: 3px solid #2d6a2d;
	color: #777;
	font-family: inherit;
	font-size: 11px;
	letter-spacing: 0.12em;
	text-transform: uppercase;
	padding: 5px 10px;
	cursor: pointer;
	opacity: 0.55;
	transition: opacity 0.12s, border-color 0.12s, color 0.12s;
}

.project-open:hover {
	opacity: 1;
	border-color: #555;
	border-left-color: #4a9a4a;
	color: #ddd;
}

.project-panel {
	position: fixed;
	inset: 0;
	background: rgba(13, 13, 13, 0.96);
	display: flex;
	align-items: center;
	justify-content: center;
	z-index: 5500;
	padding: 20px;
}

.project-panel.hidden { display: none; }

.project-panel-box {
	display: flex;
	flex-direction: column;
	gap: 10px;
	width: 100%;
	max-width: 360px;
}

.project-panel-title {
	font-size: 22px;

	letter-spacing: 0.2em;

}

.project-panel-sub {

}

.project-panel-label {
	font-size: 11px;

}

.project-staged {

}

.project-btn {
	background: #141414;

	border-left: 3px solid #2d6a2d;

.project-panel-close {

<body>

<div class="canvas-wrap">
	<canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
</div>

<div class="webgpu-log" id="webgpu-log"></div>

<div class="launcher loading" id="launcher">
	<button class="launcher-close" id="launcher-close" title="close menu">&times;</button>
	<div class="launcher-panel">
		<div class="launcher-title">KRUDD</div>
		<div class="launcher-sub">choose a scene</div>
		<div class="launcher-loading" id="launcher-loading">loading&hellip;</div>
		<div class="launcher-games" id="launcher-games"></div>
	</div>
</div>

<div class="load-prompt hidden" id="load-prompt">
	<div class="load-prompt-panel">
		<div class="load-prompt-title">load project</div>
		<button class="load-prompt-btn" id="load-prompt-btn">project</button>
	</div>
</div>

<button class="project-open" id="project-open">load project</button>

<div class="project-panel hidden" id="project-panel">
	<div class="project-panel-box">
		<div class="project-panel-title">load project</div>
		<div class="project-panel-sub">a project is one .scm file</div>
		<div class="project-panel-label" id="project-staged-label" hidden>shipped with this build</div>
		<div class="project-staged" id="project-staged"></div>
		<div class="project-panel-label">from this device</div>
		<button class="project-btn" id="project-file-btn">choose a .scm file&hellip;</button>
		<!-- An <input type=file> and a FileReader, not the File System Access
		     API: this reads one file once, which is the whole of what that API
		     would buy, and it works in every browser the engine runs in. -->
		<input type="file" id="project-file" accept=".scm,text/plain" hidden>
		<button class="project-panel-close" id="project-panel-close">close</button>
	</div>
</div>

<div class="error-backdrop" id="error-backdrop">
	<div class="error-box">
		<div class="error-header">
			<div class="error-title-row">
				<span class="error-icon">!</span>
				<span class="error-label" id="error-label"></span>
			</div>
			<div class="error-actions">
				<span class="error-source">index.wasm</span>
				<button class="error-copy" id="error-copy">copy</button>
				<button class="error-dismiss" id="error-dismiss">dismiss</button>
			</div>
		</div>
		<div class="error-body" id="error-body"></div>
	</div>
</div>

<script>
	function renderMarkdown(src) {
		var lines = src.split('\n');
		var out = '';
		var i = 0;

		function esc(s) {
			return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
		}

		function inline(s) {
			s = esc(s);
			s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
			s = s.replace(/`([^`]+)`/g, function(_, c) { return '<code>' + c + '</code>'; });
			return s;
		}

		while (i < lines.length) {
			var line = lines[i];

			if (/^```/.test(line)) {
				var code = [];
				i++;
				while (i < lines.length && !/^```/.test(lines[i]))
					code.push(esc(lines[i++]));
				out += '<pre><code>' + code.join('\n') + '</code></pre>';
				i++;
				continue;
			}
			if (/^## /.test(line))  { out += '<h2>' + inline(line.slice(3)) + '</h2>'; i++; continue; }
			if (/^### /.test(line)) { out += '<h3>' + inline(line.slice(4)) + '</h3>'; i++; continue; }
			if (/^---+$/.test(line.trim())) { out += '<hr>'; i++; continue; }
			if (/^\s*$/.test(line)) { i++; continue; }
			out += '<p>' + inline(line) + '</p>';
			i++;
		}
		return out;
	}

	function errorToMarkdown(detail) {
		var m = detail.match(/^([^\n]+)\n([\s\S]+)$/);
		var message = m ? m[1] : detail;
		var stack   = m ? m[2] : null;
		var md = '## ' + message + '\n\n';
		if (stack)
			md += '### Stack trace\n\n```\n' + stack.trim() + '\n```\n';
		return md;
	}

	document.getElementById('error-dismiss').addEventListener('click', function () {
		document.getElementById('error-backdrop').classList.remove('visible');
	});

	document.getElementById('error-copy').addEventListener('click', function () {
		var btn = this;
		var raw = document.getElementById('error-body').dataset.raw || '';
		navigator.clipboard.writeText(raw).then(function () {
			btn.textContent = 'copied!';
			btn.classList.add('copied');
			setTimeout(function () {
				btn.textContent = 'copy';
				btn.classList.remove('copied');
			}, 2000);
		});
	});

	/* Called by error_overlay.js */
	window.kruddShowError = function (title, detail) {
		document.getElementById('error-label').textContent = title;
		var body = document.getElementById('error-body');
		body.dataset.raw = title + ': ' + detail;
		body.innerHTML = renderMarkdown(errorToMarkdown(detail));
		document.getElementById('error-backdrop').classList.add('visible');
	};

	/*
	 * Arm the launcher once the first frame is on screen (called from
	 * engine_tick). Dropping the 'loading' class reveals the game buttons;
	 * before this the list is hidden, so a game cannot be picked into an
	 * engine that has not rendered yet.
	 */
	window.kruddSetReady = function () {
		var el = document.getElementById('launcher');
		if (el)
			el.classList.remove('loading');
	};

	/*
	 * Called by game_boot_default (game.c) right after it loads the boot scene
	 * and dismisses the launcher, so someone who lands on the default boot
	 * sees the "load project" splash instead of the board cold. NAME is the
	 * booted game's launcher label and becomes the button, which is the only
	 * part of this prompt that varies — the heading names the act, the button
	 * names the project it opens. A missing name leaves the markup's own
	 * label in place rather than blanking the one thing there is to click.
	 */
	window.kruddShowLoadPrompt = function (name) {
		var el = document.getElementById('load-prompt');
		if (!el)
			return;
		var btn = document.getElementById('load-prompt-btn');
		if (btn && name)
			btn.textContent = name;
		el.classList.remove('hidden');
	};

	/*
	 * Browsers only let an AudioContext leave 'suspended' from inside a
	 * user-gesture handler, so every button on this page that a player might
	 * press first resumes it directly rather than hoping a later click (a
	 * board move, say) does the job.
	 */
	function resumeAudio() {
		var ctx = window.Module && Module.__kruddAudioCtx;
		if (ctx && ctx.state !== 'running' && ctx.resume)
			ctx.resume();
	}

	document.getElementById('load-prompt-btn').addEventListener('click', function () {
		document.getElementById('load-prompt').classList.add('hidden');
		resumeAudio();
	});

	/*
	 * ── Load Project ──
	 *
	 * Getting a .scm into a running engine. The source text goes to
	 * window.kruddRunProject, which the module installs at boot
	 * (project_install_bridge in game/project/project_host.c) and which
	 * answers the launcher index the project opened on, or -1.
	 *
	 * Everything about pointers and the module heap is on that side of the
	 * call on purpose: this page hands over a JS string and reads back a
	 * number. What is left here is the two ways a project reaches the page —
	 * a file the player picks, and one this build shipped — and what to show
	 * when it does not load.
	 */
	function projectPanel(show) {
		document.getElementById('project-panel')
			.classList.toggle('hidden', !show);
	}

	/*
	 * Run SRC as a project, reporting through the error overlay rather than
	 * failing quietly. A .scm that does not load is the expected case for a
	 * button that opens whatever it is pointed at, so it gets the same
	 * treatment as a renderer that would not start: named, with the reason
	 * where it can be read, and the engine still running whatever it had.
	 */
	function kruddOpenProject(label, src) {
		var run = window.kruddRunProject;

		/* One line each: the overlay reads the first line of a detail as
		 * the message and everything after it as a stack trace (see
		 * errorToMarkdown), and none of these has one. */
		if (typeof run !== 'function') {
			window.kruddShowError('The engine is still starting',
				'It cannot open ' + label + ' until the first frame is up.');
			return;
		}
		if (run(src) < 0) {
			window.kruddShowError('Could not load ' + label,
				label + ' is not a project the engine could run \u2014 a project is '
				+ 'one .scm holding a (project "Name" ...) form, and the reason this '
				+ 'one was refused is on the engine log (the browser console).');
			return;
		}
		/* It loaded: every splash standing between the page and a scene
		 * is now stale, including the launcher this may have been opened
		 * over. Same hide the C side does on a launcher pick. */
		projectPanel(false);
		document.getElementById('launcher').classList.add('hidden');
		document.getElementById('load-prompt').classList.add('hidden');
	}

	document.getElementById('project-open').addEventListener('click', function () {
		resumeAudio();
		projectPanel(true);
	});

	document.getElementById('project-panel-close').addEventListener('click', function () {
		projectPanel(false);
	});

	document.getElementById('project-file-btn').addEventListener('click', function () {
		document.getElementById('project-file').click();
	});

	document.getElementById('project-file').addEventListener('change', function () {
		var input = this;
		var file  = input.files && input.files[0];
		var reader;

		if (!file)
			return;
		/* Cleared so that picking the SAME file again still fires a
		 * change event — re-opening a file you have just edited is the
		 * common case for this button, not a rare one. */
		input.value = '';
		reader = new FileReader();
		reader.onload = function () {
			kruddOpenProject(file.name, String(reader.result));
		};
		reader.onerror = function () {
			window.kruddShowError('Could not read ' + file.name,
				'The browser would not read the file: '
				+ String(reader.error || 'no reason given'));
		};
		reader.readAsText(file);
	});

	/*
	 * The projects this build ships, offered as the zero-friction path: no
	 * file to find, and the same door a file off the disk comes in by, so the
	 * staged project is not a special case in the engine.
	 *
	 * The names come from assets/projects.json, written by the build from
	 * every project it ships — this page cannot list a directory over HTTP,
	 * and it must not carry a filename either. A page that names a game is a
	 * generic shell that knows one, which is the pin #976 pulled out of the
	 * C. A build that shipped nothing (or a page opened without the assets/
	 * directory beside it) simply shows no list.
	 *
	 * Every shipped project appears, not only the one the image boots into:
	 * being embedded is what makes a project the boot default and says
	 * nothing about whether the page can reach it.
	 */
	function kruddStagedProjects() {
		fetch('assets/projects.json').then(function (r) {
			return r.ok ? r.json() : [];
		}).then(function (names) {
			var host  = document.getElementById('project-staged');
			var label = document.getElementById('project-staged-label');

			if (!Array.isArray(names) || names.length === 0)
				return;
			label.hidden = false;
			names.forEach(function (name) {
				var b = document.createElement('button');
				b.className = 'project-btn';
				b.textContent = name;
				b.onclick = function () {
					var url = 'assets/' + encodeURIComponent(name);

					fetch(url).then(function (r) {
						if (!r.ok)
							throw new Error('HTTP ' + r.status);
						return r.text();
					}).then(function (src) {
						kruddOpenProject(name, src);
					}).catch(function (e) {
						window.kruddShowError('Could not fetch ' + name,
							url + ' did not load: ' + String(e));
					});
				};
				host.appendChild(b);
			});
		}).catch(function () {});
	}

	kruddStagedProjects();

	/*
	 * Firefox's WebGPU implementation isn't solid enough yet to default to it,
	 * so this forces WebGL there regardless of the ?renderer= query, until
	 * that's revisited. Single source of truth for "should this page run
	 * WebGPU": engine.c's krudd_wants_webgpu reads it through
	 * window.kruddWantsWebGPU, so the page and the actual backend never
	 * disagree about which one is booting.
	 */
	function isFirefox() {
		return /firefox/i.test(navigator.userAgent);
	}

	window.kruddWantsWebGPU = function () {
		try {
			if (isFirefox())
				return false;
			return new URLSearchParams(location.search).get('renderer') !== 'webgl';
		} catch (e) {
			return true;
		}
	};

	/*
	 * Which scene the page opens on boot, read once the subsystems are up
	 * (krudd_boot_game in engine.c). ?game=<name> picks a registered game by
	 * its launcher label (matched case-insensitively), and ?game=none — or any
	 * unknown name — keeps the "choose a scene" launcher up.
	 *
	 * No ?game= at all answers the empty string, which is this page saying it
	 * has no opinion rather than naming a favourite. The engine then opens the
	 * project the build shipped staged, by the launcher slot that project took
	 * when it registered. That is deliberate: the page does not know which
	 * games a build carries any more than the engine does, and a default
	 * spelled as a literal game name here would be the same pin #976 pulled
	 * out of engine.c, just moved into HTML.
	 */
	window.kruddBootGame = function () {
		try {
			var g = new URLSearchParams(location.search).get('game');
			return g === null ? '' : g;
		} catch (e) {
			return '';
		}
	};

	/*
	 * Which GPU path actually went live. Each backend announces its own name
	 * from its init (renderer_webgl.c, webgpu_platform.c). The toolbar badge
	 * that used to show this went with the editor chrome, so the report now
	 * only reaches the diagnostic channels: the console always, and the
	 * ?webgpulog=1 panel — which is the one that survives on a phone, where
	 * there is no console to open.
	 */
	window.kruddSetRenderer = function (name) {
		var line = 'renderer: ' + name;

		if (typeof console !== 'undefined')
			console.log('[krudd] ' + line);
		window.kruddWebGPULog(line);
	};

	/*
	 * The chosen backend gave up — no instance, no adapter, or no device. The
	 * toolbar badge that used to carry this went with the editor chrome, so the
	 * report goes to the error overlay instead. It has to land somewhere: on the
	 * WebGPU path the render cluster and the game only boot once the device
	 * arrives (finish_plugin_boot in engine.c), so a page that says nothing here
	 * is indistinguishable from a slow one, and stays that way. WHY is the
	 * backend's own message; ?renderer=webgl is the way out.
	 */
	window.kruddSetRendererFailed = function (name, why) {
		var label = name === 'webgpu' ? 'WebGPU'
		          : name === 'webgl'  ? 'WebGL'
		          : String(name);

		window.kruddShowError(label + ' failed to start',
			(why || 'the browser returned no device') +
			' — reload with ?renderer=webgl for the WebGL backend.');
	};

	/*
	 * Append a line to the WebGPU probe's diagnostic log panel (see the
	 * .webgpu-log note in the stylesheet). Called from the WebGPU backend via
	 * EM_JS at each step; keeps the panel scrolled to the newest entry.
	 *
	 * Opt-in via ?webgpulog=1. WebGPU is the default renderer now, so this
	 * panel was bring-up scaffolding parked on every user's screen. It stays
	 * reachable rather than deleted because it is the only WebGPU diagnostic
	 * that survives on a phone, where there is no console to open — which is
	 * exactly how the dpr != 1 black screen (#610) got reported.
	 */
	window.kruddWebGPULogEnabled =
		new URLSearchParams(location.search).get('webgpulog') === '1';

	window.kruddWebGPULog = function (msg) {
		var box = document.getElementById('webgpu-log');
		if (!box || !window.kruddWebGPULogEnabled)
			return;
		box.classList.add('visible');
		var line = document.createElement('div');
		line.className = 'line' +
			(/fail|no adapter|no instance|no device|error/i.test(msg) ? ' err' : '');
		line.textContent = msg;
		box.appendChild(line);
		box.scrollTop = box.scrollHeight;
	};

	/* Back out of the launcher without picking a scene; the engine (and
	 * whatever scene was already running behind the overlay) keeps going. */
	document.getElementById('launcher-close').addEventListener('click', function () {
		document.getElementById('launcher').classList.add('hidden');
	});

	if ('serviceWorker' in navigator) {
		window.addEventListener('load', function () {
			navigator.serviceWorker.register('sw.js').catch(function () {});
		});
	}

</script>
