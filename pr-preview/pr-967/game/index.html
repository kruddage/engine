<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>krudd 19.2.1-pr967+2eb3f62</title>
<!-- Inline SVG favicon (data URI, no network fetch) so browsers stop
     requesting /favicon.ico and logging a 404 on every load. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20fill='%230d0d0d'/%3E%3Ctext%20x='16'%20y='23'%20font-family='Courier%20New,monospace'%20font-size='22'%20font-weight='700'%20fill='%23ffffff'%20text-anchor='middle'%3EK%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0d0d0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KRUDD">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
	background: #0d0d0d;
	color: #e0e0e0;
	font-family: 'Courier New', Courier, monospace;
	/*
	 * dvh (dynamic viewport height) tracks the *visible* viewport, so the
	 * app shrinks to fit above a mobile browser's dynamic toolbar instead
	 * of extending behind it — otherwise 100vh (the large viewport) hides
	 * the bottom strip of the canvas, and with it kruddgui's bottom-anchored
	 * panels (the mode-bar, the Log handle), under Firefox Android's URL bar.
	 * The 100vh line is the fallback for browsers without dvh.
	 */
	height: 100vh;
	height: 100dvh;
	display: flex;
	flex-direction: column;
	overflow: hidden;
}

/*
 * ── The canvas, and what used to surround it ──
 *
 * This page is the engine's game host: a canvas, a scene launcher, and the
 * overlays that report what the engine is doing. Nothing more.
 *
 * Until #953 it was also the editor. A menu bar, toolbar, four dock edges, a
 * tab-group panel system and a status bar were built here at runtime by
 * kruddBuildEditor, from the layout the engine serialized out of
 * editor_layout.scm — the one description of the chrome, stated once as data
 * (#706/#722). That mechanism worked and it is not what failed: #944 chose a
 * different substrate, and the editor is now a TypeScript application at the
 * site root with its own docks, its own panels and its own layout store.
 *
 * So the canvas keeps `flex: 1` and simply has nothing left to share the
 * column with. The whole retired frame — CSS, markup and the ~480 lines of DOM
 * builder — is recoverable from the commit before this one.
 */
.canvas-wrap {
	flex: 1;
	display: flex;
	align-items: center;
	justify-content: center;
	background: #000;
	min-height: 0;
	min-width: 0;
}

canvas {
	display: block;
	max-width: 100%;
	max-height: 100%;
	width: 100%;
	height: 100%;
}

/*
 * ── The host bar ──
 *
 * What is left of the status bar, and it keeps the two things a host page owes
 * a reader: what the engine is doing, and which build is doing it. The version
 * stamps are the same configure-file substitutions the menu bar carried, moved
 * rather than dropped — kruddmake still fills them from version.txt and git
 * (introspect.scm), so retiring the chrome cost the page no build identity.
 *
 * The editor link is deliberate. The editor is the site root and this page is
 * a route under it, so a reader who lands here from a bookmark has one obvious
 * way back — the failure #953 was opened to end was an editor nothing pointed
 * at.
 */
.hostbar {
	display: flex;
	align-items: center;
	gap: 10px;
	height: 30px;
	flex: none;
	padding: 0 14px;
	background: #101010;
	border-top: 1px solid #222;
	font-size: 11px;
	color: #888;
	letter-spacing: 0.04em;
}

.status-dot {
	width: 7px;
	height: 7px;
	flex: none;
	border-radius: 50%;
	background: #4a9a4a;
	animation: pulse 2s ease-in-out infinite;
}

.status-dot.error {
	background: #c04a4a;
	animation: none;
}

.hostbar-editor {
	margin-left: auto;
	color: #888;
	text-decoration: none;
	border-bottom: 1px dotted #444;
}

.hostbar-editor:hover { color: #ccc; border-bottom-color: #666; }

.version {
	cursor: pointer;
	color: #666;
}

.version:hover { color: #ccc; }

/* A build ahead of the last release says so in amber; the detail line spells
 * out why, from the same substitution that sets this class. */
.version.ahead { color: #d9a520; }

.version-detail {
	display: none;
	color: #555;
}

.version-detail.visible { display: inline; }

/*
 * The renderer badge, which the toolbar used to hold. It is not chrome the
 * Scheme described — it is shell behaviour (which GPU path went live, whether
 * it failed, and click-to-switch) that merely happened to be mounted in a
 * container the spec built. #953 retires containers, not behaviour, so it
 * moves here and is authored statically. It exists before wasm starts now,
 * which removes the replay g_lastRenderer was carrying for buildToolbar.
 */
.renderer {
	display: inline-flex;
	align-items: center;
	gap: 5px;
	font-size: 10px;
	letter-spacing: 0.12em;
	text-transform: uppercase;
	color: #555;
	background: none;
	border: 1px solid #2a2a2a;
	border-radius: 3px;
	padding: 2px 7px;
	font-family: inherit;
	user-select: none;
	cursor: pointer;
}

/* Clicking is a no-op when the other backend isn't reachable (see
 * canSwitchTo); the hover tint is still a mild affordance since the title
 * tooltip explains why in that case. */
.renderer:hover { border-color: #444; }

.renderer svg {
	width: 11px;
	height: 11px;
	display: block;
}

.renderer.webgl {
	color: #b98a4a;
	border-color: #4a3a22;
}

.renderer.webgpu {
	color: #4a9a4a;
	border-color: #244a24;
}

/*
 * The backend asked for a device and did not get one. Red rather than muted
 * because this is a dead end, not a pending state: nothing will render and the
 * badge would otherwise sit on "booting…" forever. The tooltip carries the
 * reason and a click switches to WebGL, which is the way out.
 */
.renderer.failed {
	color: #b95a4a;
	border-color: #4a2422;
}

/*
 * Scrolling diagnostic log for WebGPU bring-up, opt-in behind ?webgpulog=1
 * (see the panel's rationale where it is wired up). A lightweight shell-side
 * panel that carries the backend's step-by-step messages with full history —
 * unlike the single-line host bar. Hidden until the first line arrives.
 */
.webgpu-log {
	position: fixed;
	left: 0;
	right: 0;
	/* Clears the host bar, which is the same 30px the status bar was. */
	bottom: 30px;
	max-height: 42vh;
	overflow-y: auto;
	background: rgba(0, 0, 0, 0.74);
	border-top: 1px solid #333;
	font-family: 'Courier New', Courier, monospace;
	font-size: 11px;
	line-height: 1.55;
	color: #d0d0d0;
	padding: 8px 14px;
	z-index: 6000;
	display: none;
}

.webgpu-log.visible { display: block; }

.webgpu-log .line { white-space: pre-wrap; }

.webgpu-log .line.err { color: #e07a7a; }

@keyframes pulse {
	0%, 100% { opacity: 1; }
	50%       { opacity: 0.3; }
}

/* ── Launcher overlay ── */

.launcher {
	position: fixed;
	inset: 0;
	background: rgba(13, 13, 13, 0.96);
	display: flex;
	align-items: center;
	justify-content: center;
	z-index: 5000;
	padding: 20px;
}

.launcher.hidden { display: none; }

.launcher-close {
	position: absolute;
	top: 16px;
	right: 20px;
	width: 28px;
	height: 28px;
	background: none;
	border: 1px solid #333;
	color: #888;
	font-family: inherit;
	font-size: 18px;
	line-height: 1;
	cursor: pointer;
}

.launcher-close:hover { border-color: #555; color: #ccc; }

/* Matches .launcher-sub/.launcher-games: no dismissing a launcher that hasn't
 * armed its buttons yet (see kruddSetReady below). */
.launcher.loading .launcher-close { display: none; }

.launcher-panel {
	display: flex;
	flex-direction: column;
	align-items: center;
	gap: 10px;
	width: 100%;
	max-width: 360px;
}

.launcher-title {
	font-size: 32px;
	font-weight: bold;
	letter-spacing: 0.3em;
	color: #fff;
}

.launcher-sub {
	font-size: 12px;
	color: #666;
	letter-spacing: 0.15em;
	text-transform: uppercase;
	margin-bottom: 14px;
}

/*
 * Until the engine has rendered its first frame the launcher is painted (static
 * HTML) but not yet armed: the game list and its prompt are hidden and a
 * "loading" note stands in, so an impatient click has no button to hit. The
 * engine flips the .loading class off via kruddSetReady once it is live.
 *
 * The wordmark is hidden along with them, so the ordinary boot — which loads a
 * game and dismisses this overlay the moment it is armed — shows a bare
 * "loading" and then the board, never a splash screen standing between the
 * player and the game. The title is back for ?game=none, where the overlay is
 * the destination rather than something passed through.
 */
.launcher-loading {
	display: none;
	font-size: 12px;
	color: #666;
	letter-spacing: 0.15em;
	text-transform: uppercase;
}

.launcher.loading .launcher-loading { display: block; }

.launcher.loading .launcher-title,
.launcher.loading .launcher-sub,
.launcher.loading .launcher-games { display: none; }

.launcher-games {
	display: flex;
	flex-direction: column;
	gap: 10px;
	width: 100%;
}

.launcher-btn {
	background: #141414;
	border: 1px solid #333;
	border-left: 3px solid #2d6a2d;
	color: #ddd;
	font-family: inherit;
	font-size: 15px;
	letter-spacing: 0.08em;
	padding: 14px 18px;
	cursor: pointer;
	text-align: left;
	transition: border-color 0.12s, background 0.12s;
}

.launcher-btn:hover {
	background: #1c1c1c;
	border-color: #555;
	border-left-color: #4a9a4a;
	color: #fff;
}

/*
 * ── Play prompt ──
 *
 * A one-tap splash that sits over the board the moment a game boots straight
 * in (the default path — see game_boot_default in game.c, which shows this
 * right where it used to just dismiss the launcher and leave bare canvas).
 * Its Play button is also where the first user gesture lands, so the click
 * handler below resumes the WebAudio context there rather than counting on
 * whatever the player's first move happens to click.
 */
.play-prompt {
	position: fixed;
	inset: 0;
	background: rgba(13, 13, 13, 0.96);
	display: flex;
	align-items: center;
	justify-content: center;
	z-index: 5000;
	padding: 20px;
}

.play-prompt.hidden { display: none; }

.play-prompt-panel {
	display: flex;
	flex-direction: column;
	align-items: center;
	gap: 18px;
}

.play-prompt-title {
	font-size: 22px;
	font-weight: bold;
	letter-spacing: 0.2em;
	text-transform: uppercase;
	color: #fff;
}

.play-prompt-btn {
	background: #141414;
	border: 1px solid #333;
	border-left: 3px solid #2d6a2d;
	color: #ddd;
	font-family: inherit;
	font-size: 16px;
	letter-spacing: 0.15em;
	text-transform: uppercase;
	padding: 12px 40px;
	cursor: pointer;
	transition: border-color 0.12s, background 0.12s;
}

.play-prompt-btn:hover {
	background: #1c1c1c;
	border-color: #555;
	border-left-color: #4a9a4a;
	color: #fff;
}

/* ── Error overlay ── */

.error-backdrop {
	position: fixed;
	inset: 0;
	background: rgba(0, 0, 0, 0.75);
	display: none;
	align-items: center;
	justify-content: center;
	z-index: 9999;
	padding: 20px;
}

.error-backdrop.visible {
	display: flex;
}

.error-box {
	background: #111;
	border: 1px solid #5a1a1a;
	border-top: 3px solid #c0392b;
	max-width: 720px;
	width: 100%;
	max-height: 80vh;
	display: flex;
	flex-direction: column;
	box-shadow: 0 8px 40px rgba(0, 0, 0, 0.8);
}

.error-header {
	padding: 12px 16px;
	display: flex;
	align-items: center;
	justify-content: space-between;
	gap: 16px;
	border-bottom: 1px solid #2a1a1a;
	flex-shrink: 0;
}

.error-title-row {
	display: flex;
	align-items: center;
	gap: 8px;
	flex: 1;
	min-width: 0;
	overflow: hidden;
}

.error-icon {
	color: #c0392b;
	font-size: 14px;
	font-weight: bold;
	flex-shrink: 0;
}

.error-label {
	font-size: 13px;
	color: #e74c3c;
	font-weight: bold;
	letter-spacing: 0.05em;
	flex-shrink: 0;
}

.error-source {
	font-size: 11px;
	color: #555;
	padding-right: 4px;
}

.error-actions {
	display: flex;
	align-items: center;
	gap: 8px;
	flex-shrink: 0;
}

.error-dismiss,
.error-copy {
	background: none;
	border: 1px solid #333;
	color: #666;
	font-family: inherit;
	font-size: 11px;
	padding: 3px 10px;
	cursor: pointer;
	letter-spacing: 0.05em;
}

.error-dismiss:hover,
.error-copy:hover {
	border-color: #555;
	color: #aaa;
}

.error-copy.copied {
	border-color: #2d6a2d;
	color: #4a9a4a;
}

.error-body {
	padding: 14px 16px;
	overflow-y: auto;
	font-size: 12px;
	line-height: 1.6;
	color: #ccc;
	flex: 1;
	font-family: system-ui, -apple-system, sans-serif;
}

.error-body h2 {
	font-family: 'Courier New', Courier, monospace;
	color: #e74c3c;
	font-size: 13px;
	margin-bottom: 10px;
	font-weight: bold;
	letter-spacing: 0.03em;
}

.error-body h3 {
	font-family: 'Courier New', Courier, monospace;
	color: #b0b0b0;
	font-size: 12px;
	margin: 10px 0 6px;
	font-weight: bold;
	text-transform: uppercase;
	letter-spacing: 0.08em;
}

.error-body p {
	margin-bottom: 8px;
	color: #bbb;
}

.error-body strong { color: #ddd; font-weight: bold; }

.error-body code {
	font-family: 'Courier New', Courier, monospace;
	background: #1a1a1a;
	border: 1px solid #2a2a2a;
	color: #e0a05a;
	padding: 1px 5px;
	font-size: 11px;
	border-radius: 2px;
}

.error-body pre {
	background: #0a0a0a;
	border: 1px solid #222;
	border-left: 3px solid #5a1a1a;
	padding: 10px 12px;
	margin: 8px 0;
	overflow-x: auto;
	font-size: 11px;
	line-height: 1.5;
}

.error-body pre code {
	background: none;
	border: none;
	padding: 0;
	color: #ccc;
	font-size: 11px;
}

.error-body hr {
	border: none;
	border-top: 1px solid #222;
	margin: 10px 0;
}
</style>
</head>
<body>

<!--
	The game host. A canvas, and a one-line footer that says what the engine is
	doing and which build is doing it.

	Everything that used to sit around the canvas — the menu bar, the toolbar,
	the four dock edges and their panels — was built here at runtime from
	editor_layout.scm and went with it in #953. The editor is its own
	application now and lives at the site root.
-->
<div class="canvas-wrap">
	<canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
</div>

<div class="hostbar">
	<div class="status-dot" id="status-dot"></div>
	<span id="status">loading</span>
	<button class="renderer" id="renderer-badge" type="button"></button>
	<a class="hostbar-editor" href="../">open the editor</a>
	<span class="version ahead" id="version" title="click for build info">19.2.1-pr967+2eb3f62</span>
	<span class="version-detail" id="version-detail">commit b93b34b9 &middot; built 2026-07-31 &middot; ahead of release</span>
</div>

<div class="webgpu-log" id="webgpu-log"></div>

<div class="launcher loading" id="launcher">
	<button class="launcher-close" id="launcher-close" title="close menu">&times;</button>
	<div class="launcher-panel">
		<div class="launcher-title">KRUDD</div>
		<div class="launcher-sub">choose a scene</div>
		<div class="launcher-loading" id="launcher-loading">loading&hellip;</div>
		<div class="launcher-games" id="launcher-games"></div>
	</div>
</div>

<div class="play-prompt hidden" id="play-prompt">
	<div class="play-prompt-panel">
		<div class="play-prompt-title" id="play-prompt-title">Play Chess</div>
		<button class="play-prompt-btn" id="play-prompt-btn">Play</button>
	</div>
</div>

<div class="error-backdrop" id="error-backdrop">
	<div class="error-box">
		<div class="error-header">
			<div class="error-title-row">
				<span class="error-icon">!</span>
				<span class="error-label" id="error-label"></span>
			</div>
			<div class="error-actions">
				<span class="error-source">index.wasm</span>
				<button class="error-copy" id="error-copy">copy</button>
				<button class="error-dismiss" id="error-dismiss">dismiss</button>
			</div>
		</div>
		<div class="error-body" id="error-body"></div>
	</div>
</div>

<script>
	function renderMarkdown(src) {
		var lines = src.split('\n');
		var out = '';
		var i = 0;

		function esc(s) {
			return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
		}

		function inline(s) {
			s = esc(s);
			s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
			s = s.replace(/`([^`]+)`/g, function(_, c) { return '<code>' + c + '</code>'; });
			return s;
		}

		while (i < lines.length) {
			var line = lines[i];

			if (/^```/.test(line)) {
				var code = [];
				i++;
				while (i < lines.length && !/^```/.test(lines[i]))
					code.push(esc(lines[i++]));
				out += '<pre><code>' + code.join('\n') + '</code></pre>';
				i++;
				continue;
			}
			if (/^## /.test(line))  { out += '<h2>' + inline(line.slice(3)) + '</h2>'; i++; continue; }
			if (/^### /.test(line)) { out += '<h3>' + inline(line.slice(4)) + '</h3>'; i++; continue; }
			if (/^---+$/.test(line.trim())) { out += '<hr>'; i++; continue; }
			if (/^\s*$/.test(line)) { i++; continue; }
			out += '<p>' + inline(line) + '</p>';
			i++;
		}
		return out;
	}

	function errorToMarkdown(detail) {
		var m = detail.match(/^([^\n]+)\n([\s\S]+)$/);
		var message = m ? m[1] : detail;
		var stack   = m ? m[2] : null;
		var md = '## ' + message + '\n\n';
		if (stack)
			md += '### Stack trace\n\n```\n' + stack.trim() + '\n```\n';
		return md;
	}

	document.getElementById('error-dismiss').addEventListener('click', function () {
		document.getElementById('error-backdrop').classList.remove('visible');
	});

	document.getElementById('error-copy').addEventListener('click', function () {
		var btn = this;
		var raw = document.getElementById('error-body').dataset.raw || '';
		navigator.clipboard.writeText(raw).then(function () {
			btn.textContent = 'copied!';
			btn.classList.add('copied');
			setTimeout(function () {
				btn.textContent = 'copy';
				btn.classList.remove('copied');
			}, 2000);
		});
	});

	/* Called by error_overlay.js */
	window.kruddShowError = function (title, detail) {
		document.getElementById('error-label').textContent = title;
		var body = document.getElementById('error-body');
		body.dataset.raw = title + ': ' + detail;
		body.innerHTML = renderMarkdown(errorToMarkdown(detail));
		document.getElementById('error-backdrop').classList.add('visible');
		document.getElementById('status-dot').classList.add('error');
		document.getElementById('status').textContent = 'exception';
	};

	/* Signal that the engine is running (called after Module init) */
	window.kruddSetRunning = function () {
		document.getElementById('status').textContent = 'running';
	};

	/*
	 * Arm the launcher once the first frame is on screen (called from
	 * engine_tick). Dropping the 'loading' class reveals the game buttons;
	 * before this the list is hidden, so a game cannot be picked into an
	 * engine that has not rendered yet.
	 */
	window.kruddSetReady = function () {
		var el = document.getElementById('launcher');
		if (el)
			el.classList.remove('loading');
	};

	/*
	 * Called by game_boot_default (game.c) right after it loads the boot scene
	 * and dismisses the launcher, so a player who lands on the default chess
	 * boot sees a "Play Chess" splash instead of the board cold. NAME is the
	 * booted game's launcher label; an empty/missing one falls back to
	 * "Play" so a future non-chess default still reads sensibly.
	 */
	window.kruddShowPlayPrompt = function (name) {
		var el = document.getElementById('play-prompt');
		if (!el)
			return;
		var title = document.getElementById('play-prompt-title');
		if (title)
			title.textContent = name ? 'Play ' + name : 'Play';
		el.classList.remove('hidden');
	};

	document.getElementById('play-prompt-btn').addEventListener('click', function () {
		document.getElementById('play-prompt').classList.add('hidden');
		/*
		 * Browsers only let an AudioContext leave 'suspended' from inside a
		 * user-gesture handler, so this is the one guaranteed gesture every
		 * player makes before hearing anything — resume it directly rather
		 * than hope a later click (a board move, say) does the job.
		 */
		var ctx = window.Module && Module.__kruddAudioCtx;
		if (ctx && ctx.state !== 'running' && ctx.resume)
			ctx.resume();
	});

	/*
	 * kruddSetEditorMode was here: plugin_abi.c called it whenever the GAME /
	 * EDITOR slider moved, and one class on <body> showed or hid the whole
	 * frame. There is no frame to show now, so the hook is gone from both
	 * sides (#953). The engine's editor mode itself is unchanged — kruddgui
	 * still writes the flag and scene_renderer still reads it — this page just
	 * has nothing to do about it.
	 */

	/*
	 * Firefox's WebGPU implementation isn't solid enough yet to default to it,
	 * so this forces WebGL there regardless of the ?renderer= query, until
	 * that's revisited. Single source of truth for "should this page run
	 * WebGPU": both the launcher-hiding check below and engine.c's
	 * krudd_wants_webgpu (via window.kruddWantsWebGPU) read it, so the shell
	 * chrome and the actual backend never disagree.
	 */
	function isFirefox() {
		return /firefox/i.test(navigator.userAgent);
	}

	window.kruddWantsWebGPU = function () {
		try {
			if (isFirefox())
				return false;
			return new URLSearchParams(location.search).get('renderer') !== 'webgl';
		} catch (e) {
			return true;
		}
	};

	/*
	 * Which scene the editor opens on boot. The engine reads this once the
	 * subsystems are up (krudd_boot_game in engine.c) and loads the matching
	 * game, so the page lands on a real scene — chess by default — instead of
	 * the "choose a scene" overlay. ?game=<name> picks another registered game
	 * (matched case-insensitively against its launcher label), and ?game=none
	 * (or any unknown name) keeps the launcher up.
	 */
	window.kruddBootGame = function () {
		try {
			var g = new URLSearchParams(location.search).get('game');
			return g === null ? 'chess' : g;
		} catch (e) {
			return 'chess';
		}
	};

	/*
	 * The renderer badge. A backend calls kruddSetRenderer from its init with
	 * its own name; the badge shows which GPU path went live — WebGPU by
	 * default, WebGL when ?renderer=webgl opts out (or always, on Firefox).
	 * Separately we probe navigator.gpu on load so the tooltip can say whether
	 * WebGPU was even available; on the WebGL path, a "WebGPU available" note
	 * flags the upgrade. Clicking the badge switches renderers when the other
	 * path is actually reachable (see switchRenderer below).
	 *
	 * Until a backend reports, the badge shows the path this shell chose (see
	 * rendererBootLabel). That gap is real: WebGPU's adapter/device handshake
	 * is async, so on Chrome the badge sits on its boot text for as long as the
	 * browser takes to answer, and forever if it never does — which is what
	 * kruddSetRendererFailed exists to say out loud.
	 *
	 * The badge is static markup in the host bar (#953). It used to be the
	 * layout's toolbar "renderer" badge, built by kruddBuildEditor from the
	 * spec, which meant it could arrive *after* the first backend report on a
	 * slow build — so g_lastRenderer existed to let buildToolbar replay that
	 * report once the element landed. The element now predates wasm, so the
	 * race is gone; g_lastRenderer stays because kruddSetRendererFailed and
	 * refreshRendererTitle both read the last report back.
	 */
	var RENDERER_ICON =
		'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor"' +
		' stroke-width="1.3" stroke-linecap="round">' +
		'<rect x="4" y="4" width="8" height="8" rx="1"/>' +
		'<rect x="6.5" y="6.5" width="3" height="3" rx="0.5"/>' +
		'<path d="M6 4V2M10 4V2M6 14v-2M10 14v-2M4 6H2M4 10H2' +
		'M14 6h-2M14 10h-2"/></svg>';

	/* The last thing a backend reported: {name, failed, why}, or null before
	 * any of them has spoken. */
	var g_lastRenderer = null;

	/* null = not probed yet, true/false once navigator.gpu has answered. */
	window.kruddWebGPUAvailable = null;

	function rendererLabel(name) {
		return name === 'webgpu' ? 'WebGPU'
		     : name === 'webgl'  ? 'WebGL'
		     : String(name);
	}

	/*
	 * What the badge says before any backend has reported. The layout seeds a
	 * backend-neutral "renderer — booting…" because the spec describes the
	 * chrome, not what ends up drawing into it, and naming a backend there
	 * would be the spec asserting something it cannot know. The shell can:
	 * it has already chosen the path (kruddWantsWebGPU) before wasm even
	 * starts, so say which one rather than leave the page vague for the whole
	 * handshake.
	 */
	function rendererBootLabel() {
		var name;

		try {
			name = window.kruddWantsWebGPU() ? 'webgpu' : 'webgl';
		} catch (e) {
			name = 'webgpu';
		}
		return rendererLabel(name) + ' — booting…';
	}

	/* Whether clicking the badge could switch TO this renderer right now.
	 * WebGL always works; WebGPU only if this isn't Firefox (locked off above)
	 * and the on-load adapter probe actually found one — offering a switch
	 * that would just reload into the same broken state is worse than not
	 * offering it. */
	function canSwitchTo(name) {
		if (name === 'webgl')
			return true;
		return !isFirefox() && window.kruddWebGPUAvailable === true;
	}

	function refreshRendererTitle() {
		var el = document.getElementById('renderer-badge');
		if (!el)
			return;
		var active = el.dataset.active || '';
		var avail  = window.kruddWebGPUAvailable;
		var other  = active === 'webgpu' ? 'webgl' : 'webgpu';
		var t;

		if (el.dataset.failed) {
			t = 'renderer: ' + rendererLabel(active) + ' failed to start';
			if (g_lastRenderer && g_lastRenderer.why)
				t += ' — ' + g_lastRenderer.why;
			if (canSwitchTo(other))
				t += ' · click to switch to ' + rendererLabel(other);
		} else if (active === 'webgpu') {
			t = 'renderer: WebGPU';
			if (canSwitchTo('webgl')) t += ' · click to switch to WebGL';
		} else if (active === 'webgl') {
			t = 'renderer: WebGL';
			if (isFirefox()) {
				t += ' · WebGPU disabled on Firefox for now';
			} else if (avail === true) {
				t += ' · click to switch to WebGPU';
			} else if (avail === false) {
				t += ' · WebGPU unavailable';
			}
		} else {
			/* No backend has reported yet — name the path being booted, the
			 * same one the badge itself is showing. */
			t = 'renderer: ' + rendererBootLabel();
		}
		el.title = t;
	}

	/* The renderer is picked at boot (krudd_wants_webgpu in engine.c), so
	 * switching means reloading with an updated ?renderer= query rather than
	 * hot-swapping the live backend. WebGPU is the default, so switching to it
	 * just drops the query param instead of writing it out. */
	function switchRenderer(name) {
		var url = new URL(location.href);
		if (name === 'webgpu')
			url.searchParams.delete('renderer');
		else
			url.searchParams.set('renderer', name);
		location.href = url.toString();
	}

	/* Paint the badge from the last report. Kept split out of kruddSetRenderer
	 * because a failure has to paint through exactly the path a success does —
	 * that was true when buildToolbar replayed it too, and it is the half of
	 * the reason that outlived the toolbar. */
	function applyRendererBadge() {
		var el = document.getElementById('renderer-badge');
		if (!el || !g_lastRenderer)
			return;
		var name  = g_lastRenderer.name;
		var known = name === 'webgl' || name === 'webgpu';
		var label = rendererLabel(name);

		if (g_lastRenderer.failed)
			label += ' — unavailable';
		el.className = (known ? 'renderer ' + name : 'renderer') +
			       (g_lastRenderer.failed ? ' failed' : '');
		el.dataset.active = name;
		el.dataset.failed = g_lastRenderer.failed ? '1' : '';
		el.innerHTML = RENDERER_ICON + '<span>' + label + '</span>';
		refreshRendererTitle();
	}

	window.kruddSetRenderer = function (name) {
		g_lastRenderer = { name: name, failed: false, why: '' };
		applyRendererBadge();
	};

	/*
	 * The chosen backend gave up — no instance, no adapter, or no device. It
	 * has nothing to draw with and no later callback is coming, so the badge
	 * has to stop saying "booting…": a page frozen on that is indistinguishable
	 * from a slow one, and on the WebGPU path it also means the render cluster
	 * and the game never boot (finish_plugin_boot waits on the device). WHY is
	 * the backend's own message; the tooltip carries it and offers the switch
	 * to WebGL, which is the way out.
	 */
	window.kruddSetRendererFailed = function (name, why) {
		g_lastRenderer = { name: name, failed: true, why: why || '' };
		applyRendererBadge();
	};

	/* Attach the click-to-switch behaviour to the renderer badge, and seed it
	 * with the path this shell chose. Ran from buildToolbar when the badge was
	 * built from the layout; runs at parse time now that it is static markup. */
	(function wireRendererBadge() {
		var el = document.getElementById('renderer-badge');
		if (!el)
			return;
		el.textContent = rendererBootLabel();
		el.addEventListener('click', function () {
			var active = el.dataset.active;
			var target = active === 'webgpu' ? 'webgl' : 'webgpu';
			if (canSwitchTo(target))
				switchRenderer(target);
		});
		refreshRendererTitle();
	})();

	/*
	 * Append a line to the WebGPU probe's diagnostic log panel (see the
	 * .webgpu-log note in the stylesheet). Called from the WebGPU backend via
	 * EM_JS at each step; keeps the panel scrolled to the newest entry.
	 *
	 * Opt-in via ?webgpulog=1. WebGPU is the default renderer now, so this
	 * panel was bring-up scaffolding parked on every user's screen. It stays
	 * reachable rather than deleted because it is the only WebGPU diagnostic
	 * that survives on a phone, where there is no console to open — which is
	 * exactly how the dpr != 1 black screen (#610) got reported.
	 */
	window.kruddWebGPULogEnabled =
		new URLSearchParams(location.search).get('webgpulog') === '1';

	window.kruddWebGPULog = function (msg) {
		var box = document.getElementById('webgpu-log');
		if (!box || !window.kruddWebGPULogEnabled)
			return;
		box.classList.add('visible');
		var line = document.createElement('div');
		line.className = 'line' +
			(/fail|no adapter|no instance|no device|error/i.test(msg) ? ' err' : '');
		line.textContent = msg;
		box.appendChild(line);
		box.scrollTop = box.scrollHeight;
	};

	/* Probe WebGPU support once at load; requestAdapter is async, so the
	 * tooltip updates whenever it resolves. Absent navigator.gpu is a plain
	 * "unavailable", not an error. Skipped on Firefox — it's locked to WebGL
	 * regardless of what the adapter probe would say, so probing there would
	 * only make the badge dangle a switch option canSwitchTo would never
	 * offer. */
	(function detectWebGPU() {
		if (isFirefox() || !navigator.gpu ||
		    typeof navigator.gpu.requestAdapter !== 'function') {
			window.kruddWebGPUAvailable = false;
			refreshRendererTitle();
			return;
		}
		navigator.gpu.requestAdapter().then(function (adapter) {
			window.kruddWebGPUAvailable = !!adapter;
		}).catch(function () {
			window.kruddWebGPUAvailable = false;
		}).then(refreshRendererTitle);
	})();

	document.getElementById('version').addEventListener('click', function () {
		document.getElementById('version-detail').classList.toggle('visible');
	});

	/* Back out of the launcher without picking a scene; the engine (and
	 * whatever scene was already running behind the overlay) keeps going. */
	document.getElementById('launcher-close').addEventListener('click', function () {
		document.getElementById('launcher').classList.add('hidden');
	});

	if ('serviceWorker' in navigator) {
		window.addEventListener('load', function () {
			navigator.serviceWorker.register('sw.js').catch(function () {});
		});
	}

</script>
