<!doctype html>
<!--
  SPDX-License-Identifier: GPL-2.0-or-later

  The page `cargo xtask build-web` stamps into dist/index.html.

  Deliberately small, per #819: a canvas, a readout, and a module tag. The
  editor's chrome is a later initiative and belongs in data rather than here
  (#830), so there is nothing else to hand-write yet — and the generated
  wasm-bindgen glue, which is most of the shipped bytes, is never hand-edited.

  The version placeholder below is substituted at build time from version.txt.
  The build fails if any placeholder of that shape survives, so a renamed one
  cannot ship to the page as literal text.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>krudd 18.8.4</title>
    <!--
      An empty icon rather than none. A browser requests /favicon.ico
      regardless, and a page whose whole job is to make failures visible should
      not open with a 404 in the console that means nothing.
    -->
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: dark;
        --ink: #e6e6ea;
        --bad: #ff6b6b;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: #101014;
        color: var(--ink);
        overflow: hidden;
      }
      /*
        The canvas fills the window and is sized here in CSS pixels only. Its
        drawing buffer — canvas.width/height — is set from devicePixelRatio by
        `fitCanvas` in @krudd/boundary, which is the one place that knows the
        difference between the two sizes a canvas has. The buffer is capped at
        what the WebGL2 backend can present, so on a tall phone it is smaller
        than this box and the browser stretches it: softer, rather than the
        validation error a 2256-pixel-tall surface is.
      */
      #viewport {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      /*
        The readout: a status line while booting, a debug line once running,
        and a failure card if either goes wrong. One element in three states,
        because a page this small does not need three elements.
      */
      #status {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        margin: 0;
        padding: 0.5rem 0.75rem;
        font-size: 0.75rem;
        line-height: 1.5;
        color: color-mix(in srgb, var(--ink) 65%, transparent);
        background: color-mix(in srgb, #101014 70%, transparent);
        pointer-events: none;
      }
      /*
        A failure takes the whole screen. Not decoration: a renderer that stops
        drawing leaves the last frame on the canvas, so a failure shown as a
        footnote under a picture that still looks fine is a failure nobody
        reads. #812's rule is that an instrument may never report "broken" and
        "fine" the same way.
      */
      #status.failed {
        /*
          Full-bleed, with only the text column capped — a card narrower than
          the window would leave the last rendered frame showing down both
          sides of the failure, which is precisely the mixed signal this is
          here to avoid.
        */
        inset: 0;
        display: grid;
        grid-template-columns: minmax(0, 40rem);
        align-content: center;
        justify-content: center;
        padding: 2rem;
        font-size: 0.9rem;
        color: var(--bad);
        background: #101014;
        white-space: pre-wrap;
        pointer-events: auto;
      }
      noscript {
        display: block;
        padding: 1rem;
        color: var(--bad);
      }
    </style>
  </head>
  <body>
    <noscript>krudd needs JavaScript and WebAssembly.</noscript>
    <canvas id="viewport"></canvas>
    <p id="status">loading krudd 18.8.4…</p>
    <script type="module" src="./index.js"></script>
  </body>
</html>
