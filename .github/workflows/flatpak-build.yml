name: Flatpak build (editor) — BLOCKED on #821

# THIS WORKFLOW CANNOT CURRENTLY SUCCEED, AND THAT IS EXPECTED.
#
# It packaged the native Qt editor out of `krudd/`, which #814 deleted along
# with the rest of the C and Scheme tree. The Tauri 2 shell that replaces it is
# #821, and #812's plan is that #821 fills this workflow in rather than that
# the delete removes it — so the file stays, with everything below the guard
# step intact as the machinery #821 adapts: the signing opt-in, the export, the
# bundle, and the self-hosted gh-pages registry that a Steam Deck subscribes to.
#
# Two things changed here as part of the delete, both to stop it failing
# noisily on its own:
#
#   * The `release` and push-to-main triggers are gone. Only workflow_dispatch
#     remains, so nothing starts this by accident.
#   * release-please no longer dispatches it after cutting a tag (see the end
#     of .github/workflows/release-please.yml). Dispatching a build that cannot
#     succeed would have turned every release red.
#
# The consequence, stated rather than discovered: the self-hosted Flatpak
# registry is frozen at whatever it last published, and `flatpak update` on a
# Deck pulls nothing new until #821 lands. That is the accepted cost of
# delete-and-replace over strangler-fig.
on:
  workflow_dispatch:

jobs:
  flatpak-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One serial group for every gh-pages writer. ci.yml's deploy and preview
    # jobs publish the site to the same branch (#820), so sharing this group
    # name is what stops two jobs pushing to gh-pages at once — a concurrent
    # push is rejected non-fast-forward. Both sides publish with keep_files, so
    # the site never deletes the registry below and the registry never deletes
    # the site.
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      # The editor compiles entirely inside the flatpak-builder sandbox against
      # org.kde.Sdk's own Qt6 and Vulkan loader/headers, so the runner needs
      # nothing but the Flatpak tooling — no toolchain, no prebuilt GPU library.
      # elfutils provides eu-strip, which flatpak-builder invokes to split debug
      # info off the built binary. Without it the build fails at the strip step
      # ("Failed to execute child process eu-strip") after a clean compile, so
      # nothing is ever exported or published.
      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder elfutils

      - name: Add Flathub remote (org.kde.Platform/Sdk)
        run: |
          flatpak remote-add --if-not-exists --user flathub \
            https://flathub.org/repo/flathub.flatpakrepo

      # The guard. Everything below this point is kept for #821 to adapt, but
      # it cannot run today: the manifest copies in `krudd/`, and there is no
      # `krudd/` any more. Failing here with the reason beats failing three
      # minutes later inside flatpak-builder with "no such file or directory".
      - name: This build is blocked on #821
        run: |
          echo "::error::The Flatpak packages the native Qt editor from krudd/," \
               "which #814 deleted. #821 replaces it with the Tauri 2 shell." >&2
          exit 1

      - name: flatpak-builder
        run: |
          flatpak-builder --user --force-clean --install-deps-from=flathub \
            packaging/flatpak/build-dir \
            packaging/flatpak/io.github.kruddage.Editor.yml

      # Signing is opt-in: forks/self-hosters that want their own signed
      # registry set this secret (see packaging/flatpak/README.md); without
      # it, the steps below still produce an unsigned bundle for local
      # testing but skip publishing.
      - name: Check for a configured signing key
        id: signing
        run: |
          if [ -n "${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import signing key
        if: steps.signing.outputs.enabled == 'true'
        id: gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.FLATPAK_GPG_PASSPHRASE }}

      - name: Export the repo (signed)
        if: steps.signing.outputs.enabled == 'true'
        run: |
          flatpak build-export --gpg-sign="${{ steps.gpg.outputs.fingerprint }}" \
            packaging/flatpak/export-repo packaging/flatpak/build-dir

      - name: Export the repo (unsigned — local/test builds only)
        if: steps.signing.outputs.enabled != 'true'
        run: |
          flatpak build-export packaging/flatpak/export-repo packaging/flatpak/build-dir

      - name: Bundle a .flatpak for the workflow artifact
        run: |
          if [ "${{ steps.signing.outputs.enabled }}" = true ]; then
            sign_arg="--gpg-sign=${{ steps.gpg.outputs.fingerprint }}"
          else
            sign_arg=""
          fi
          flatpak build-bundle $sign_arg packaging/flatpak/export-repo \
            krudd-editor.flatpak io.github.kruddage.Editor

      - name: Upload .flatpak artifact
        uses: actions/upload-artifact@v7
        with:
          name: krudd-editor-flatpak
          path: krudd-editor.flatpak

      # Publish only the authoritative build: a signed export from a release
      # tag or a packaging change on main. On a release build github.ref is the
      # tag (refs/tags/vX.Y.Z), not refs/heads/main — true both for a `release`
      # event and for the tag-ref workflow_dispatch release-please sends, which
      # is the path that actually fires (see the header). A dispatch at some
      # other ref, or a PR build, still signs nothing to gh-pages. A fork with
      # its own FLATPAK_GPG_PRIVATE_KEY set gets its own registry published to
      # *its own* gh-pages, at its own <owner>.github.io/<repo>/ URL — nothing
      # here is kruddage-specific.
      - name: Publish the signed registry to gh-pages
        if: steps.signing.outputs.enabled == 'true' && (github.event_name == 'release' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          repo_url="https://${{ github.repository_owner }}.github.io/${GITHUB_REPOSITORY#*/}/flatpak/"
          mkdir -p packaging/flatpak/pages-out
          cp -r packaging/flatpak/export-repo/. packaging/flatpak/pages-out/
          ./packaging/flatpak/make-flatpakrepo.sh "$repo_url" \
            "${{ steps.gpg.outputs.fingerprint }}" \
            packaging/flatpak/pages-out/krudd.flatpakrepo

      - name: Deploy to gh-pages
        if: steps.signing.outputs.enabled == 'true' && (github.event_name == 'release' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: packaging/flatpak/pages-out
          publish_branch: gh-pages
          destination_dir: flatpak
          keep_files: true
