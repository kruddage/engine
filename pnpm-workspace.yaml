#
# The workspace is the physical design of the JavaScript layer, and this list is
# all of it: two packages under packages/, one tool. Each declares a name, a
# surface and what it may reach, and `pnpm check` reads those declarations back
# (see WORKSPACE.md, Q1). There are no third-party dependencies to resolve.
#
# krudd/ is not here. #917 gave two of the C tree's twenty-three modules a
# manifest and #924 was to have given the other twenty-one theirs; #924 closed
# unstarted, and a tree that is 2/23 packaged is worse than one that is 0/23,
# because a reader cannot tell whether the missing modules are pending or
# excluded on purpose. They are excluded on purpose (#934). The C build is
# kruddmake — Scheme behind a POSIX shell entry point, needing a compiler and
# nothing else — and a manifest beside a build.scm bought that tree nothing it
# did not already have, while inviting Node into the one path that is deliberate
# about not needing it (WORKSPACE.md, Q2).
#
# `packages/*` is a glob rather than a list so a new JS package is inside the
# boundary check the moment it exists; scripts/check-barriers.mjs reads the same
# shape back, because a package the check does not know about is a package with
# no boundary.
packages:
  - packages/*
  - tools/render-diff
