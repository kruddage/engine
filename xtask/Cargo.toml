[package]
name = "xtask"
description = "The build driver. Not part of the engine's tier order."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints.clippy]
pedantic = "warn"

# No dependencies, on purpose. xtask is the first thing a clean checkout
# builds, so every crate here is latency between `git clone` and a running
# engine — and an argument parser and a static file server are each under a
# hundred lines of std. "krudd builds krudd" also reads better when the build
# driver is first-party the whole way down.
[dependencies]
