# The krudd workspace. Cargo compiles; `cargo xtask` drives everything Cargo
# does not (the wasm-bindgen step, the TypeScript build, the dev server) so
# there is exactly one build entry point — see xtask/src/main.rs and
# docs/architecture.md.
#
# Members are listed in tier order, the same order the directories read in on
# disk: a crate may depend on a crate in its own tier or a lower one, never a
# higher one. `cargo xtask check` enforces that; the tiers themselves are
# described in docs/architecture.md.
[workspace]
resolver = "3"
members = [
	"crates/base/math",
	"crates/world/storage",
	"crates/world/asset",
	"crates/render/gpu",
	"crates/render/renderer",
	"crates/shell/web",
	"xtask",
]

[workspace.package]
# Nothing here is published to crates.io — the engine ships as a wasm module
# and a static site, not as libraries. The released version of the engine as a
# whole is version.txt, maintained by release-please; keeping the crate
# versions at 0.0.0 avoids two version numbers that would drift apart.
version = "0.0.0"
edition = "2024"
license = "GPL-2.0-or-later"
repository = "https://github.com/kruddage/engine"
publish = false

[workspace.dependencies]
krudd-math = { path = "crates/base/math" }
krudd-world = { path = "crates/world/storage" }
krudd-asset = { path = "crates/world/asset" }
krudd-gpu = { path = "crates/render/gpu" }
krudd-render = { path = "crates/render/renderer" }
wasm-bindgen = "0.2"

# Optimise the wasm for size rather than raw speed: it is fetched over the
# network before anything can run, so bytes are latency. `opt-level = "s"`
# rather than "z" — "z" also disables loop vectorisation, which the hot path
# wants.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
