# Pinning the toolchain here is what makes "works from a clean checkout" true:
# rustup reads this file and installs the wasm target and the two components
# `cargo xtask check` needs, so nobody has to remember `rustup target add`.
#
# The channel is `stable` rather than a fixed version because the style gates
# are rustfmt and clippy at their defaults (CODING_STANDARD.md) — those move
# with the toolchain by design, and pinning would freeze them.
[toolchain]
channel = "stable"
targets = ["wasm32-unknown-unknown"]
components = ["rustfmt", "clippy"]
