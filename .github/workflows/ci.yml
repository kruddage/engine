name: CI

# One job running one command. `cargo xtask check` is the whole gate, and it is
# the same command a contributor runs locally — a gate that only exists in a
# workflow file is a gate nobody can run before pushing, and the C tree
# accumulated several of those.
#
# What it covers: the crate/package tier order, rustfmt, clippy with warnings
# denied, the Rust test suite, the wasm build, wasm-bindgen, the TypeScript
# bundle, tsc, and biome. See xtask/src/check.rs.
#
# NOT covered, deliberately, until the hello-triangle chain lands (#818, #819):
#   * the GitHub Pages deploy and the per-PR preview — #820. There is nothing
#     worth looking at to publish yet, and a deploy of a status line would only
#     make the site look alive.
#   * the Flatpak — #821. flatpak-build.yml is dispatch-only and cannot
#     currently succeed; it packages the deleted C editor.
#   * sanitizers and gcov coverage — those gated the C build. Rust's own
#     guarantees replace most of what ASan caught; a coverage report on the new
#     tree is worth adding once there is enough of it to measure.

on:
  pull_request:
  push:
    branches: [main]

# A superseded run on the same branch is wasted CI; cancel it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # rust-toolchain.toml pins the channel and lists the wasm target plus
      # rustfmt and clippy, so rustup installs everything on the first cargo
      # invocation. Nothing to configure here.
      - name: Show the toolchain
        run: |
          rustc --version
          cargo --version

      # Caches cargo's registry and the target directory, keyed on the
      # lockfile. The expensive part of a cold run is `cargo install
      # wasm-bindgen-cli`, which lands in ~/.cargo/bin and is cached with it.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install the TypeScript dependencies
        run: pnpm install --frozen-lockfile

      # A PR build stamps -pr<N>+<sha> so an artifact from one can never be
      # mistaken for a release build. A main build stamps version.txt verbatim,
      # which xtask reads on its own when KRUDD_VERSION is unset.
      - name: Determine the version
        if: github.event_name == 'pull_request'
        run: |
          base=$(cat version.txt)
          short=$(printf '%.7s' "${{ github.event.pull_request.head.sha }}")
          echo "KRUDD_VERSION=${base}-pr${{ github.event.pull_request.number }}+${short}" >> "$GITHUB_ENV"

      - name: cargo xtask check
        run: cargo xtask check

      # Not a gate — a number worth being able to look at, since the wasm is
      # fetched before anything can run.
      - name: Report the release artifact sizes
        run: cargo xtask dist

      - name: Upload the build
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
