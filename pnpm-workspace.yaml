#
# The workspace is the outer build system: it sequences the packages and
# enforces the boundaries between them. It does not replace kruddmake — the
# engine's C/WASM build stays in krudd/ and is driven by @kruddage/kruddmake,
# which @kruddage/engine depends on and wraps (see packages/engine/README.md).
#
# krudd/kruddmake is that build language, and one of the two C-tree packages
# that carry a real `test`: its Scheme suite runs on the fetched s7 interpreter
# with no compiler and no emsdk (#920).
#
# krudd/engine/** is the C tree. Those packages carry no build or test script —
# a C module's build is one edge in one ninja graph and cannot be driven per
# module — so they are here as names, dependency lists and surfaces, which is
# what #917 is for. The glob matches directories that hold a package.json and
# ignores the rest, so a module joins the workspace by gaining a manifest beside
# its build.scm rather than by being added to a list here (#918, Q1).
packages:
  - packages/*
  - tools/render-diff
  - krudd/kruddmake
  - krudd/engine/**
