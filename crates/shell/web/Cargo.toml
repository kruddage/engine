[package]
name = "krudd-web"
description = "The wasm module the browser loads. Tier: shell."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# cdylib is what `cargo build --target wasm32-unknown-unknown` turns into a
# .wasm; rlib keeps `cargo test` able to build it for the host so the tests
# below run without a browser.
[lib]
crate-type = ["cdylib", "rlib"]

[lints.rust]
missing_docs = "warn"

[lints.clippy]
pedantic = "warn"

[dependencies]
krudd-gpu.workspace = true
krudd-math.workspace = true
krudd-render.workspace = true
krudd-webgl.workspace = true
krudd-world.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys.workspace = true
# For `SurfaceTarget::Canvas` alone. Everything else about the GPU is
# krudd-webgl's business — this crate names the canvas because it is the only
# one allowed to know the browser exists.
wgpu.workspace = true
