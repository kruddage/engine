name: CI

on:
  pull_request:
    # `closed` is included so the preview job can tear down a PR's preview
    # directory when the PR is merged or closed. The default set is
    # [opened, synchronize, reopened]; adding closed keeps those and adds it.
    types: [opened, reopened, synchronize, closed]
  push:
    branches: [main]

jobs:
  lint:
    # Skip on PR-close events — nothing to lint then.
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lint .scm comments
        run: python3 .github/scripts/lint-scm-comments.py $(git ls-files '*.scm')

      # The workspace's own suite: the artifact contract, the site staging
      # rules, and the boundary check that keeps packages from reaching past
      # each other's "exports" map. No compiler and no emsdk — this is all
      # Node — so it rides along with the other lint steps rather than waiting
      # on the WASM build.
      #
      # There is no install step. The workspace has no third-party
      # dependencies, so there was never anything to fetch; the one thing
      # `pnpm install` produced was a symlink, and workspace.sh makes it
      # itself before every task (#1010).
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Workspace tests
        run: sh tools/workspace/workspace.sh test

      - name: Workspace boundaries
        run: sh tools/workspace/workspace.sh check

      # kruddmake's Scheme suite, reached by path rather than through the
      # workspace — the same choice `sanitizers` and `coverage` make below,
      # and for the same reason (WORKSPACE.md, Q2): it runs on the pinned s7
      # CLI that sync.sh fetches with curl, needs no compiler, and needs no
      # Node either, so routing it through the workspace would add a dependency
      # for no gain. It used to arrive as a side effect of the recursive test
      # task; that stopped working when krudd/ left the workspace and this
      # stopped being a package's `test` script (#934), so it is named as its
      # own step now.
      - name: kruddmake Scheme suite
        run: sh krudd/kruddmake/run-scheme-tests.sh

      # .scm files are indented per CODING_STANDARD.md's Scheme section: spaces,
      # call arguments aligned under the first argument — Emacs scheme-mode's
      # stock indenter output, so there's a single mechanical arbiter instead of
      # a per-line human judgment call.
      - name: Install emacs for the .scm indent check
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends emacs-nox

      - name: Check .scm indentation
        run: python3 .github/scripts/indent-scm.py --check $(git ls-files '*.scm')

  build:
    # Skip the build on PR-close events — there is nothing to publish, the
    # preview job only needs to remove the stale directory.
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    container: emscripten/emsdk:6.0.2
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The container runs as root, so git refuses to touch the checkout
      # ("dubious ownership") and introspect.scm would bake "unknown" into the
      # shell template's cache-busting hook instead of the commit hash — which
      # the site staging step then reads back out and stages against. Mark it
      # safe first.
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # kruddmake.sh picks clang first if it's on PATH, falling back to gcc
      # then cc, so installing clang here makes CI build with it by default
      # while keeping gcc as the fallback compiler. curl is required by
      # krudd/third_party/sync.sh to fetch the latest s7 release artifacts
      # (header + static libs + CLI), which are not committed to the repo.
      - name: Install a host compiler and ninja for krudd
        run: apt-get update && apt-get install -y clang gcc ninja-build curl

      # The released version is the single line in version.txt, maintained by
      # release-please (see .github/workflows/release-please.yml). A push/main
      # build stamps that version verbatim. A PR build appends -pr<N>+<sha> so
      # its preview is uniquely identifiable and can never be mistaken for a
      # real release — mirroring the prerelease suffix the old label-fold job
      # produced.
      # This runs under `sh` (dash) inside the emsdk container, so keep it
      # POSIX: printf '%.7s' truncates to 7 chars where bash would use the
      # non-portable ${sha:0:7}.
      - name: Determine version
        id: version
        run: |
          base=$(cat version.txt)
          if [ "${{ github.event_name }}" = pull_request ]; then
            short=$(printf '%.7s' "${{ github.event.pull_request.head.sha }}")
            echo "version=${base}-pr${{ github.event.pull_request.number }}+${short}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${base}" >> "$GITHUB_OUTPUT"
          fi

      # The build enters through the workspace. @kruddage/engine still
      # runs krudd/kruddmake/kruddmake.sh underneath — kruddmake remains the
      # build system for C and WASM, generating build.ninja from the directory
      # specs and driving ninja with emcc/em++ directly, no cmake and no
      # emcmake. What the package adds is the boundary: it harvests the
      # outputs into a dist/ with a manifest describing them, and everything
      # downstream reads that instead of the build tree. KRUDD_VERSION comes
      # from the version step above — see introspect.scm.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Fetches nothing — there are no third-party dependencies. It makes the
      # one symlink `packages/site` needs in order to say `@kruddage/engine`
      # rather than reach into it by relative path, which the boundary check's
      # rule 1 forbids (#1010). The steps below then call each package's build
      # script by path, which is what `--filter` used to spell.
      - name: Link workspace
        run: sh tools/workspace/workspace.sh link

      - name: Build the engine
        env:
          KRUDD_VERSION: ${{ steps.version.outputs.version }}
        run: node packages/engine/scripts/build.mjs

      # Replaces stage-site.sh. Same whitelist-only staging — the build tree
      # carries objects and archives that must never reach the Pages branch —
      # but the cache-busting hash now comes from the built index.html's
      # Module.locateFile hook rather than a second, independent `git rev-parse`
      # that merely had to agree with it. See packages/site/src/stage.mjs.
      - name: Stage site
        run: node packages/site/scripts/build.mjs

      - name: Upload staged site
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: packages/site/dist
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Serialize every gh-pages writer under one group, so two runs never push
    # to gh-pages at once — a concurrent push is rejected non-fast-forward.
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Download staged site
        uses: actions/download-artifact@v8
        with:
          name: site
          path: public

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          # keep_files preserves the pr-preview/ directory tree that the
          # preview job writes into the same gh-pages branch; without it a
          # main deploy would delete every open PR's preview. The trade-off is
          # that old hash-named index.<hash>.{js,wasm} from previous main
          # deploys are no longer pruned and accumulate at the site root.
          keep_files: true

  # Publishes each pull request's staged build to
  # gh-pages/pr-preview/pr-<N>/ and comments the preview URL on the PR, then
  # removes that directory when the PR is closed or merged. Scoped to
  # same-repository PRs: the pull_request token is read-only for forks, so a
  # fork PR cannot push to gh-pages. (Supporting forks safely would require a
  # separate pull_request_target/workflow_run job that deploys outside the
  # untrusted build context.)
  preview:
    needs: build
    # !cancelled() lifts the implicit "needs succeeded" gate so this still runs
    # on the close event (where build is skipped). Deploys only when the build
    # succeeded; the close path tears down regardless of the build.
    if: >-
      ${{ !cancelled() && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && (github.event.action == 'closed' || needs.build.result == 'success') }}
    runs-on: ubuntu-latest
    # This job only publishes a convenience preview deploy; it isn't a
    # correctness gate (lint/build/sanitizers/coverage already cover that).
    # A gh-pages push race or preview-action hiccup shouldn't hold up
    # auto-merge, so let it fail without failing the job.
    continue-on-error: true
    permissions:
      contents: write
      pull-requests: write
    # Serialize a single PR's preview runs so rapid pushes don't race each
    # other pushing to gh-pages; keyed per-PR so different PRs stay independent.
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - name: Download staged site
        if: github.event.action != 'closed'
        uses: actions/download-artifact@v8
        with:
          name: site
          path: public

      - name: Deploy preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: public
          preview-branch: gh-pages
          umbrella-dir: pr-preview

  # Build and run the native test suite under AddressSanitizer + UBSan +
  # LeakSanitizer. This is the memory-safety / undefined-behaviour gate: a
  # detected leak, out-of-bounds access, or UB fails the job. It runs on a
  # plain ubuntu-latest (no emsdk container) because sanitizers need a native
  # host build — the CI `build` job only produces the WASM artifact. gcc is
  # used because its libasan/libubsan runtimes ship with the runner image;
  # the sanitizer flags ride in through kruddmake's KRUDD_EXTRA_* env hooks so
  # this is the ordinary native build with instrumentation, not a fork of it.
  #
  # It calls run-tests.sh by path rather than through the workspace, and that
  # is deliberate, not an oversight: this job needs no Node at all, and
  # routing a C test run through the workspace to satisfy a slogan would put
  # Node in its path for no gain (WORKSPACE.md, Q2). `coverage` below makes
  # the same call for the same reason.
  sanitizers:
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc g++ ninja-build curl

      - name: Build + run native suite under ASan + UBSan + LeakSanitizer
        env:
          CC: gcc
          KRUDD_CC: gcc
          KRUDD_CXX: g++
          KRUDD_BUILD_DIR: ${{ github.workspace }}/build-san
          KRUDD_EXTRA_CFLAGS: >-
            -fsanitize=address,undefined -fno-omit-frame-pointer
            -fno-sanitize-recover=undefined -g -O1
          KRUDD_EXTRA_LDFLAGS: -fsanitize=address,undefined
          # Fail the run on the first leak / error rather than only printing it.
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: sh krudd/kruddmake/run-tests.sh

  # Measure native line/function/branch coverage with gcov and post it as a
  # sticky comment on the PR. This is REPORT-ONLY — it never fails the build;
  # the floor gate is intentionally deferred until the baseline has been
  # watched (see README). Coverage needs its own -O0 --coverage build, so it
  # runs separately from the sanitizer job in its own build directory.
  #
  # It also calls run-tests.sh by path rather than through the workspace —
  # same reasoning as `sanitizers` above, see that job's comment.
  coverage:
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        run: |
          sudo apt-get update && sudo apt-get install -y gcc g++ ninja-build curl
          pipx install gcovr

      - name: Build + run native suite with gcov instrumentation
        env:
          CC: gcc
          KRUDD_CC: gcc
          KRUDD_CXX: g++
          KRUDD_BUILD_DIR: ${{ github.workspace }}/build-cov
          KRUDD_EXTRA_CFLAGS: --coverage -O0 -g -fprofile-abs-path
          KRUDD_EXTRA_LDFLAGS: --coverage
        run: sh krudd/kruddmake/run-tests.sh

      # Scope to engine production code: test files and vendored third_party/
      # are excluded so the number reflects code the suite is meant to cover.
      - name: Generate coverage report
        run: |
          gcovr --root . --filter 'krudd/engine/' \
            --exclude '.*_test\.c$' --exclude 'krudd/third_party/' \
            --gcov-object-directory build-cov --gcov-ignore-parse-errors=all \
            --json-summary coverage-summary.json --txt coverage.txt
          cat coverage.txt
          python3 .github/scripts/coverage-report.py \
            coverage-summary.json coverage-comment.md

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            coverage.txt
            coverage-comment.md

      # Only same-repo PRs: a fork PR's GITHUB_TOKEN is read-only, so the
      # measurement still runs above but the comment post is skipped for forks.
      # Temporarily disabled (comment posting only; report is still uploaded
      # as a build artifact above).
      - name: Post coverage comment
        if: false
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('coverage-comment.md', 'utf8');
            const marker = '<!-- krudd-coverage-report -->';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(
              github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(
              c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment(
                { owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment(
                { owner, repo, issue_number, body });
            }
